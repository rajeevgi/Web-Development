<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            padding: 10px;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-around;
            background-color: black;
            color: white;
        }

        .logo {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 10px;
        }

        .nav-links li a {
            text-decoration: none;
            color: white;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">My Navbar</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Home</a></li>
            <li><a href="#">Home</a></li>
            <li><a href="#">Home</a></li>
        </ul>
    </nav>
</body>
</html>
